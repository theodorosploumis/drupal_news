# Example: Using Portkey proxy with Grok
# Copy this to providers.yaml and customize with your keys

default_provider: grok

providers:
  # Standard providers (no proxy)
  openai:
    client: openai_client
    model: gpt-4.1-mini
    temperature: 0.2

  anthropic:
    client: anthropic_client
    model: claude-haiku-4-5-20251001
    temperature: 0.2

  # Grok via Portkey proxy
  grok:
    client: grok_client
    model: grok-beta  # or grok-4-fast-reasoning
    temperature: 0.2
    api_url: https://api.portkey.ai/v1
    headers:
      x-portkey-api-key: YOUR_PORTKEY_API_KEY_HERE
      x-portkey-virtual-key: YOUR_GROK_VIRTUAL_KEY_HERE
      # Optional: Add other Portkey features
      # x-portkey-trace-id: drupal-news-trace
      # x-portkey-cache-force-refresh: true

  # Ollama (local)
  ollama:
    client: ollama_client
    model: qwen2.5:7b-instruct
    temperature: 0.2
    api_url: http://localhost:11434

  # OpenRouter
  openrouter:
    client: openrouter_client
    model: meta-llama/llama-3.1-8b-instruct
    temperature: 0.2
    # Optional: Use Portkey with OpenRouter too
    # api_url: https://api.portkey.ai/v1
    # headers:
    #   x-portkey-api-key: YOUR_PORTKEY_API_KEY_HERE
    #   x-portkey-provider: openrouter
