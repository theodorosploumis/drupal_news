name: Test Build

on:
  pull_request:
    branches: [ main, master ]

jobs:
  test-build:
    name: Test package build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Install package
      run: |
        pip install dist/*.whl

    - name: Test CLI commands
      run: |
        drupal-news --help
        drupal-news-scheduler --help
        drupal-news-email --help
        drupal-news-viewer --help || true

    - name: Test imports
      run: |
        python -c "import drupal_news; print('✓ Package imports successfully')"
        python -c "from drupal_news import index; print('✓ index module imports')"
        python -c "from drupal_news import cli; print('✓ cli module imports')"

    - name: Success
      run: |
        echo "✓ Package builds successfully on Python ${{ matrix.python-version }}"
