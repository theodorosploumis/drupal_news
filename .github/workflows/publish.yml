name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Verify VERSION file matches tag
      run: |
        FILE_VERSION=$(cat VERSION | tr -d '\n')
        TAG_VERSION=${{ steps.version.outputs.version }}
        if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
          echo "Error: VERSION file ($FILE_VERSION) doesn't match tag ($TAG_VERSION)"
          exit 1
        fi
        echo "✓ Version verified: $TAG_VERSION"

    - name: Build package
      run: |
        echo "Building drupal-news v${{ steps.version.outputs.version }}"
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: List built packages
      run: |
        ls -lh dist/
        echo "Built packages:"
        echo "  - $(ls dist/*.tar.gz)"
        echo "  - $(ls dist/*.whl)"

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "Publishing to PyPI..."
        twine upload dist/*

    - name: Extract changelog
      id: changelog
      run: |
        VERSION=${{ steps.version.outputs.version }}
        # Extract changelog for this version from RELEASES.md
        CHANGELOG=$(awk "/## \[$VERSION\]/,/## \[/" RELEASES.md | sed '1d;$d' | sed '/^$/d')

        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="Release v$VERSION"
        fi

        # Save to file for multiline support
        echo "$CHANGELOG" > /tmp/changelog.txt
        echo "changelog_file=/tmp/changelog.txt" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: ${{ steps.changelog.outputs.changelog_file }}
        files: |
          dist/*.tar.gz
          dist/*.whl
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Success message
      run: |
        echo "✓ Successfully published drupal-news v${{ steps.version.outputs.version }} to PyPI"
        echo "✓ GitHub Release created"
        echo ""
        echo "Package is now available at:"
        echo "  https://pypi.org/project/drupal-news/${{ steps.version.outputs.version }}/"
        echo ""
        echo "Install with:"
        echo "  pip install drupal-news==${{ steps.version.outputs.version }}"
