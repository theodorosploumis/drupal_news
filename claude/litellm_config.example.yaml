# Example LiteLLM proxy configuration
#
# Prerequisites:
# 1. Set API keys in .env file
# 2. Install LiteLLM: pip install litellm[proxy]
#
# Usage:
# cp litellm_config.example.yaml litellm_config.yaml
# litellm --config litellm_config.yaml
#
# The proxy will run on http://localhost:4000 by default
# Then configure providers.yaml to point to this URL

model_list:
  # OpenAI Models
  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-4
      api_key: os.environ/OPENAI_API_KEY

  # Anthropic Models
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-3-opus
    litellm_params:
      model: anthropic/claude-3-opus-20240229
      api_key: os.environ/ANTHROPIC_API_KEY

  # Google Gemini Models
  - model_name: gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GOOGLE_API_KEY

  # Grok Models (xAI)
  - model_name: grok-beta
    litellm_params:
      model: xai/grok-beta
      api_key: os.environ/GROK_API_KEY

  # DeepSeek Models
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  # Qwen Models
  - model_name: qwen2.5-7b-chat
    litellm_params:
      model: qwen/qwen-turbo
      api_key: os.environ/QWEN_API_KEY

  # OpenRouter Models
  - model_name: llama-3.1-8b
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: mixtral-8x7b
    litellm_params:
      model: openrouter/mistralai/mixtral-8x7b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

# Optional: Load balancing with multiple API keys
# Uncomment to enable automatic rotation across keys
#
# model_list:
#   - model_name: gpt-4
#     litellm_params:
#       model: openai/gpt-4
#       api_key: os.environ/OPENAI_API_KEY_1
#
#   - model_name: gpt-4
#     litellm_params:
#       model: openai/gpt-4
#       api_key: os.environ/OPENAI_API_KEY_2
#
#   - model_name: gpt-4
#     litellm_params:
#       model: openai/gpt-4
#       api_key: os.environ/OPENAI_API_KEY_3

# Optional: Fallback configuration
# If primary model fails, automatically try fallback
#
# model_list:
#   - model_name: gpt-4
#     litellm_params:
#       model: openai/gpt-4
#       api_key: os.environ/OPENAI_API_KEY
#       fallbacks: [{"model": "anthropic/claude-3-5-sonnet-20241022"}]

# Optional: Cost limits and budgets
# litellm_settings:
#   max_budget: 100  # Max $100/month
#   budget_duration: 30d

# Optional: Enable authentication
# Uncomment to require master key for all requests
#
# general_settings:
#   master_key: your-secret-master-key-here

# Optional: Enable request logging
# general_settings:
#   success_callback: ["langfuse"]  # Or "lunary", "helicone", etc.
#   failure_callback: ["langfuse"]

# Optional: Rate limiting
# router_settings:
#   routing_strategy: least-busy  # Or "simple-shuffle", "latency-based-routing"
#   redis_host: localhost
#   redis_port: 6379

# Optional: Caching
# cache:
#   type: redis
#   host: localhost
#   port: 6379
#   ttl: 3600  # Cache for 1 hour
