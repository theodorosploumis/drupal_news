# Example providers.yaml using the generic client for various services
#
# The generic client works with ANY OpenAI-compatible API endpoint.
# Use this when you want maximum flexibility without creating new provider code.
#
# Usage:
# cp providers.generic.example.yaml providers.yaml
# ./index.py --provider generic --days 7

default_provider: generic

providers:
  # Example 1: OpenRouter (multiple models)
  generic:
    client: generic_client
    model: meta-llama/llama-3.1-70b-instruct
    temperature: 0.2
    api_url: https://openrouter.ai/api/v1
    headers:
      Authorization: Bearer ${OPENROUTER_API_KEY}
      HTTP-Referer: https://your-site.com  # Optional
      X-Title: Drupal News Aggregator  # Optional

  # Example 2: Together AI
  together:
    client: generic_client
    model: mistralai/Mixtral-8x7B-Instruct-v0.1
    temperature: 0.2
    api_url: https://api.together.xyz/v1
    headers:
      Authorization: Bearer ${TOGETHER_API_KEY}

  # Example 3: Groq
  groq:
    client: generic_client
    model: llama-3.1-70b-versatile
    temperature: 0.2
    api_url: https://api.groq.com/openai/v1
    headers:
      Authorization: Bearer ${GROQ_API_KEY}

  # Example 4: Perplexity
  perplexity:
    client: generic_client
    model: llama-3.1-sonar-large-128k-online
    temperature: 0.2
    api_url: https://api.perplexity.ai
    headers:
      Authorization: Bearer ${PERPLEXITY_API_KEY}

  # Example 5: Fireworks AI
  fireworks:
    client: generic_client
    model: accounts/fireworks/models/llama-v3p1-70b-instruct
    temperature: 0.2
    api_url: https://api.fireworks.ai/inference/v1
    headers:
      Authorization: Bearer ${FIREWORKS_API_KEY}

  # Example 6: Azure OpenAI
  azure:
    client: generic_client
    model: gpt-4  # Your deployment name
    temperature: 0.2
    api_url: https://YOUR-RESOURCE.openai.azure.com/openai/deployments/YOUR-DEPLOYMENT
    headers:
      api-key: ${AZURE_OPENAI_API_KEY}

  # Example 7: LiteLLM Proxy (any model)
  litellm:
    client: generic_client
    model: gpt-4  # Model name from litellm_config.yaml
    temperature: 0.2
    api_url: http://localhost:4000

  # Example 8: Custom self-hosted endpoint
  custom:
    client: generic_client
    model: your-custom-model
    temperature: 0.2
    api_url: https://your-custom-endpoint.com/v1
    headers:
      Authorization: Bearer your-custom-token
      X-Custom-Header: custom-value

  # Example 9: Multiple OpenRouter models
  openrouter-llama:
    client: generic_client
    model: meta-llama/llama-3.1-70b-instruct
    temperature: 0.2
    api_url: https://openrouter.ai/api/v1
    headers:
      Authorization: Bearer ${OPENROUTER_API_KEY}

  openrouter-claude:
    client: generic_client
    model: anthropic/claude-3.5-sonnet
    temperature: 0.2
    api_url: https://openrouter.ai/api/v1
    headers:
      Authorization: Bearer ${OPENROUTER_API_KEY}

  openrouter-gemini:
    client: generic_client
    model: google/gemini-pro-1.5
    temperature: 0.2
    api_url: https://openrouter.ai/api/v1
    headers:
      Authorization: Bearer ${OPENROUTER_API_KEY}

# Environment variables to set in .env:
#
# OPENROUTER_API_KEY=sk-or-...
# TOGETHER_API_KEY=...
# GROQ_API_KEY=gsk_...
# PERPLEXITY_API_KEY=pplx-...
# FIREWORKS_API_KEY=...
# AZURE_OPENAI_API_KEY=...
# GENERIC_API_KEY=...  # Fallback for any service
# GENERIC_API_URL=...  # Fallback API URL

# Note: You can also use GENERIC_API_KEY and GENERIC_API_URL as fallback
# environment variables if you don't want to set headers explicitly:
#
# providers:
#   generic:
#     client: generic_client
#     model: meta-llama/llama-3.1-70b-instruct
#     temperature: 0.2
#     # api_url not set -> uses GENERIC_API_URL from .env
#     # headers not set -> uses GENERIC_API_KEY from .env for Authorization
