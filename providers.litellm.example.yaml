# Example providers.yaml configuration for LiteLLM proxy
#
# Prerequisites:
# 1. Install LiteLLM: pip install litellm[proxy]
# 2. Create litellm_config.yaml (see docs/CUSTOM_API_URLS.md)
# 3. Start LiteLLM proxy: litellm --config litellm_config.yaml
# 4. LiteLLM runs on http://localhost:4000 by default
#
# Usage:
# cp providers.litellm.example.yaml providers.yaml
# ./index.py --provider openai --days 7

default_provider: openai

providers:
  # OpenAI via LiteLLM
  openai:
    client: openai_client
    model: gpt-4.1-mini  # Must match model_name in litellm_config.yaml
    temperature: 0.2
    api_url: http://localhost:4000

  # Anthropic via LiteLLM (uses OpenAI-compatible client)
  anthropic:
    client: openai_client
    model: claude-3-5-sonnet  # Must match model_name in litellm_config.yaml
    temperature: 0.2
    api_url: http://localhost:4000

  # Gemini via LiteLLM
  gemini:
    client: openai_client
    model: gemini-1.5-pro  # Must match model_name in litellm_config.yaml
    temperature: 0.2
    api_url: http://localhost:4000

  # Grok via LiteLLM
  grok:
    client: grok_client
    model: grok-beta  # Must match model_name in litellm_config.yaml
    temperature: 0.2
    api_url: http://localhost:4000

  # DeepSeek via LiteLLM
  deepseek:
    client: deepseek_client
    model: deepseek-chat  # Must match model_name in litellm_config.yaml
    temperature: 0.2
    api_url: http://localhost:4000

  # Qwen via LiteLLM
  qwen:
    client: openai_client
    model: qwen2.5-7b-chat  # Must match model_name in litellm_config.yaml
    temperature: 0.2
    api_url: http://localhost:4000

  # OpenRouter via LiteLLM (proxy through proxy!)
  openrouter:
    client: openrouter_client
    model: meta-llama/llama-3.1-8b-instruct
    temperature: 0.2
    api_url: http://localhost:4000

  # Local Ollama (still direct connection, not through LiteLLM)
  ollama:
    client: ollama_client
    model: qwen2.5:7b-instruct
    temperature: 0.2
    api_url: http://localhost:11434

  # Local LM Studio (still direct connection)
  lmstudio:
    client: lmstudio_client
    model: qwen2.5:7b-instruct
    temperature: 0.2
    api_url: http://localhost:1234

# Optional: LiteLLM with authentication
# If your LiteLLM proxy has master_key enabled:
#
# providers:
#   openai:
#     client: openai_client
#     model: gpt-4.1-mini
#     temperature: 0.2
#     api_url: http://localhost:4000
